<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Kolejli yakında sizlerle. Yeni koleksiyonumuz için takipte kalın.">
  <title>Kolejli — Yakında Sizlerle</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:dark; --bg:#050505; --fg:#f5f3ee; --muted:#a09d96; --accent:#d8c7a2; }
    * { box-sizing:border-box }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); }
    body { font-family:'DM Sans',sans-serif; min-height:100vh; display:grid; place-items:center; overflow:hidden; }
    .page { position:relative; isolation:isolate; width:min(100%,1440px); min-height:100svh; display:grid; grid-template-rows:auto 1fr auto; padding:32px clamp(24px,6vw,88px) 28px; }
    .page:before { content:""; position:absolute; z-index:-2; inset:0; background:linear-gradient(90deg,rgba(5,5,5,.97) 0%,rgba(5,5,5,.91) 36%,rgba(5,5,5,.68) 66%,rgba(5,5,5,.78) 100%),url('Kolejli Logo.PNG') center/cover no-repeat; opacity:.62; }
    .page:after { content:""; position:absolute; z-index:-1; inset:0; background:radial-gradient(ellipse at 75% 48%,transparent 0%,rgba(0,0,0,.1) 35%,#050505 85%); }
    header { display:flex; align-items:center; justify-content:space-between; }
    .brand { font-family:Manrope,sans-serif; font-size:20px; font-weight:800; letter-spacing:.25em; text-decoration:none; color:var(--fg); }
    .status { color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:.22em; display:flex; align-items:center; gap:10px; }
    .dot { width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px #d8c7a277; }
    main { align-self:center; max-width:700px; padding:72px 0 90px; }
    .eyebrow { display:flex; align-items:center; gap:14px; color:var(--accent); text-transform:uppercase; letter-spacing:.24em; font-size:10px; font-weight:600; }
    .eyebrow:before { content:""; display:block; width:32px; height:1px; background:var(--accent); }
    h1 { font-family:Manrope,sans-serif; font-size:clamp(54px,9vw,112px); letter-spacing:-.075em; line-height:.98; font-weight:500; margin:28px 0 24px; }
    h1 span { color:var(--accent); }
    .intro { color:#aaa7a0; font-size:clamp(15px,1.5vw,18px); line-height:1.8; max-width:440px; margin:0; }
    .rule { margin-top:42px; width:120px; height:1px; background:linear-gradient(90deg,var(--accent),transparent); }
    footer { display:flex; justify-content:space-between; align-items:center; color:#77746e; font-size:11px; letter-spacing:.08em; }
    footer .note { text-transform:uppercase; letter-spacing:.16em; }
    @media(max-width:600px) {
      .page { padding:25px 22px 22px; }
      header { gap:18px; }
      .brand { flex:0 0 auto; font-size:17px; letter-spacing:.21em; }
      .status { min-width:0; font-size:8px; letter-spacing:.1em; line-height:1.35; text-align:right; }
      main { max-width:100%; padding:48px 0 64px; }
      .eyebrow { gap:12px; letter-spacing:.2em; }
      h1 { font-size:clamp(52px,15vw,76px); letter-spacing:-.08em; line-height:.96; margin:25px 0 22px; }
      .intro { max-width:340px; font-size:15px; line-height:1.7; }
      .rule { margin-top:34px; width:100px; }
      footer { font-size:10px; }
      footer .note { max-width:140px; text-align:right; line-height:1.6; }
      /* Keep the full wordmark inside the phone viewport instead of cropping its final "i". */
      .page:before { background-position:68% 58%; background-size:150% auto; opacity:.48; }
    }
    @media(prefers-reduced-motion:no-preference) { main { animation:arrive .9s ease-out both; } @keyframes arrive { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:translateY(0) } } }
  </style>
</head>
<body>
  <div class="page">
    <header><a class="brand" href="#" aria-label="Kolejli ana sayfa">KOLEJLİ</a><div class="status"><span class="dot"></span>Yeni koleksiyon hazırlanıyor</div></header>
    <main><div class="eyebrow">Tarzın yeni adresi</div><h1>Yakında<br><span>sizlerle.</span></h1><p class="intro">Kolejli’nin yeni dünyası çok yakında burada. Yeni sezonu ilk keşfedenlerden olmak için takipte kalın.</p><div class="rule"></div></main>
    <footer><span>© <span id="year"></span> KOLEJLİ</span><span class="note">Çok yakında online</span></footer>
  </div>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
